name: Build APK\n\non: [push]\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout code\n        uses: actions/checkout@v2\n      - name: Set up Node.js\n        uses: actions/setup-node@v2\n        with:\n          node-version: '16'\n      - name: Install dependencies\n        run: npm install\n      - name: Build project\n        run: npm run build\n      - name: Install Capacitor Android dependencies\n        run: npx cap sync android\n      - name: Build APK\n        run: cd android && ./gradlew assembleDebug
