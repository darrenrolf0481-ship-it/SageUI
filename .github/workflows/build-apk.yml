name: Build SAGE Capacitor APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to manually click "Run workflow" in GitHub

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java (Android SDK requires this)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install NPM Dependencies
      run: npm install

    - name: Build React UI
      run: npm run build

    - name: Initialize Capacitor Android
      run: npx cap add android

    - name: Apply Android Security Hints & Permissions (Automated)
      run: |
        # 1. Create the XML resource folder
        mkdir -p android/app/src/main/res/xml
        
        # 2. Copy the network security config to allow Termux localhost access
        cp android-hints/network_security_config.xml android/app/src/main/res/xml/ || echo "No network config found, skipping."
        
        # 3. Inject cleartext traffic allowance into the generated Manifest
        sed -i 's/<application/<application android:networkSecurityConfig="@xml\/network_security_config" android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
        
        # 4. Inject hardware permissions (Haptics, Sensors, Internet)
        sed -i '/<application/i \
        <uses-permission android:name="android.permission.INTERNET" />\n\
        <uses-permission android:name="android.permission.VIBRATE" />\n\
        <uses-permission android:name="android.permission.HIGH_SAMPLING_RATE_SENSORS" />\n' android/app/src/main/AndroidManifest.xml

    - name: Build Debug APK
      run: |
        cd android
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: Upload APK for Download
      uses: actions/upload-artifact@v4
      with:
        name: SAGE-Sentinel-v4
        path: android/app/build/outputs/apk/debug/app-debug.apk
