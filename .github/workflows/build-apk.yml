name: Build Android APK
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install Dependencies
        run: npm install

      - name: Build React UI
        run: npm run build

      # NO-HUNT FIX: This creates the missing folder and moves your file there automatically
      - name: Fix Android Resource Paths
        run: |
          mkdir -p android/app/src/main/res/xml
          cp network_security_config.xml android/app/src/main/res/xml/ || true
          # Also remove the line from Manifest just in case the file copy fails
          sed -i '/android:networkSecurityConfig/d' android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SageUI-Final-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
